    <text x="510" y="33" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11">@claude</text>
    <text x="25" y="62" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Scaffolding authentication middleware and token verification logic.</text>
    
    <!-- Lock Badge -->
    <rect x="25" y="74" width="220" height="22" rx="4" fill="#450a0a" stroke="#991b1b"/>
    <text x="35" y="89" fill="#f87171" font-family="JetBrains Mono, monospace" font-size="11">🔒 LOCKED: src/middleware/*</text>
    
    <rect x="990" y="25" width="105" height="26" rx="8" fill="#082f49"/>
    <text x="1005" y="42" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold">$0.16 USD</text>

    <!-- Action Buttons -->
    <rect x="970" y="65" width="125" height="32" rx="8" fill="#16a34a"/>
    <text x="985" y="85" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Mark Complete</text>
  </g>

  <!-- Task Card 3: Blocked by Dependencies -->

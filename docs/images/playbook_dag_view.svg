    <rect width="1120" height="95" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <text x="25" y="35" fill="#cbd5e1" font-family="Inter, sans-serif" font-weight="bold" font-size="15">Phase 3: Integration Test Suite (Delegated to Codex)</text>

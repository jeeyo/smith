  <text x="40" y="75" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Non-racing task negotiation, atomic leases, and file-scope locking with USD resource tracking</text>

  <!-- Task Card 1: Completed -->
  <g transform="translate(40, 110)">
    <rect width="1120" height="95" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="35" fill="#e2e8f0" font-family="Inter, sans-serif" font-weight="bold" font-size="15">Phase 1: Architecture &amp; Token Specifications</text>
    <rect x="360" y="18" width="65" height="22" rx="11" fill="#064e3b" stroke="#059669"/>
    <text x="375" y="33" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="bold">✔ Done</text>
    <rect x="435" y="18" width="75" height="22" rx="6" fill="#1e293b"/>
    <text x="445" y="33" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11">@claude</text>
    <text x="25" y="62" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Designed Ed25519 token rotation model and retained decisions into Hindsight memory.</text>
    
    <!-- Lock & Cost -->
    <text x="25" y="82" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11">Scope: src/auth/types.ts</text>
    <rect x="1000" y="25" width="95" height="26" rx="8" fill="#064e3b"/>
    <text x="1015" y="42" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold">$0.06 USD</text>
  </g>

  <!-- Task Card 2: In Progress (Locked) -->
  <g transform="translate(40, 225)">
    <rect width="1120" height="110" rx="12" fill="#082f49" fill-opacity="0.2" stroke="#0284c7" stroke-width="2"/>
    <text x="25" y="35" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="bold" font-size="15">Phase 2: Implement Route Guards &amp; Middleware</text>
    <rect x="395" y="18" width="95" height="22" rx="11" fill="#0c4a6e" stroke="#0284c7"/>
    <text x="407" y="33" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="bold">▶ In Progress</text>

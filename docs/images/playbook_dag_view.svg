    <text x="388" y="33" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Unassigned</text>
    <text x="25" y="62" fill="#64748b" font-family="Inter, sans-serif" font-size="12">Review token expiration headers, rate limiting, and write API OpenAPI documentation.</text>
    
    <rect x="990" y="30" width="105" height="32" rx="8" fill="#0284c7"/>
    <text x="1005" y="51" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Claim Task</text>

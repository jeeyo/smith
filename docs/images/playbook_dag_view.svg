    <text x="438" y="33" fill="#fbbf24" font-family="Inter, sans-serif" font-size="11" font-weight="bold">🔒 Blocked</text>
    <text x="25" y="62" fill="#64748b" font-family="Inter, sans-serif" font-size="12">Depends on Phase 2 completion. Will execute automatically under @codex once locks are released.</text>
    <text x="25" y="82" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11">Scope: tests/auth.test.ts</text>
  </g>

  <!-- Task Card 4: Unassigned -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="650" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="50" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="bold" font-size="20">Inter-Agent Team Broadcast Bus (arXiv:2610.22319)</text>
  <text x="40" y="75" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Real-time intent broadcasting, hazard warnings, and anti-pattern memory exchange between agents</text>

  <!-- Message 1: Intent -->
  <g transform="translate(40, 110)">
    <rect width="1120" height="85" rx="12" fill="#090d16" stroke="#1e293b"/>
    <text x="25" y="30" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="bold" font-size="13">Claude</text>
    <rect x="85" y="15" width="55" height="20" rx="4" fill="#082f49"/>
    <text x="95" y="29" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="bold">INTENT</text>
    <text x="1040" y="30" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11">15:32:10</text>
    <text x="25" y="60" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12">I am claiming Task #1: Implement JWT token verification in src/auth/jwt.ts. Locked scope: src/auth/*.</text>
  </g>

  <!-- Message 2: Anti-Pattern Alert -->
  <g transform="translate(40, 210)">
    <rect width="1120" height="120" rx="12" fill="#450a0a" fill-opacity="0.15" stroke="#991b1b"/>
    <text x="25" y="30" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="bold" font-size="13">Claude</text>
    <rect x="85" y="15" width="95" height="20" rx="4" fill="#7f1d1d"/>
    <text x="95" y="29" fill="#f87171" font-family="Inter, sans-serif" font-size="10" font-weight="bold">ANTI-PATTERN</text>
    <text x="1040" y="30" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11">15:33:04</text>
    <text x="25" y="60" fill="#fca5a5" font-family="Inter, sans-serif" font-size="12">Discovered execution error: ReferenceError: require is not defined in ES module scope.</text>
    <rect x="25" y="75" width="1070" height="40" rx="6" fill="#1e1b4b"/>
    <text x="40" y="100" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="12">✔ Lesson Retained in Hindsight: Use `import crypto from 'node:crypto'` instead of `require()`. All teammates notified.</text>
  </g>

  <!-- Message 3: Codex Response & Handoff -->
  <g transform="translate(40, 345)">
    <rect width="1120" height="85" rx="12" fill="#090d16" stroke="#1e293b"/>
    <text x="25" y="30" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="bold" font-size="13">Codex</text>
    <rect x="85" y="15" width="65" height="20" rx="4" fill="#064e3b"/>
    <text x="95" y="29" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="bold">HANDOFF</text>
    <text x="1040" y="30" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11">15:34:12</text>
    <text x="25" y="60" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12">Acknowledged. Received Anti-Pattern warning. Standing by to claim Task #2 (Integration Tests) as soon as Claude releases lock.</text>
  </g>

  <!-- Input Form -->
  <g transform="translate(40, 560)">
    <rect width="1120" height="50" rx="12" fill="#090d16" stroke="#334155"/>
    <rect x="10" y="10" width="80" height="30" rx="8" fill="#1e293b"/>
    <text x="30" y="29" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="bold">INTENT ▾</text>
    <text x="110" y="30" fill="#64748b" font-family="Inter, sans-serif" font-size="12">Broadcast intent, handoff, or warning to all agents...</text>
    <rect x="1010" y="8" width="100" height="34" rx="8" fill="#0284c7"/>
    <text x="1030" y="30" fill="#ffffff" font-family="Inter, sans-serif" font-weight="bold" font-size="12">Broadcast</text>
  </g>
</svg>
